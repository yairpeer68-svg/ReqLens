name: Android build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Inspect legacy hevtunnel classes
        run: |
          AAR=$(find ~/.gradle/caches/modules-2/files-2.1/com.zaneschepke/hevtunnel/1.0.1 -type f -name '*.aar' | head -n 1)
          echo "AAR=$AAR"
          mkdir -p /tmp/hev
          cd /tmp/hev
          unzip -o "$AAR" classes.jar
          echo "===== HEVTUNNEL CLASSES ====="
          jar tf classes.jar | grep -Ei 'TProxy|Tunnel|Hev|Service' || true

      - run: gradle --no-daemon clean :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ReqLens-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
